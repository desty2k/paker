name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests
        run: pytest --cov=paker --cov-report=xml -v

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  integration-smoke:
    name: Integration smoke — Python 3.14 / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv-pack
          .venv-pack/bin/python -m pip install --upgrade pip
          .venv-pack/bin/pip install -e .
          .venv-pack/bin/pip install psutil click pydantic requests pyyaml rich jinja2 sqlalchemy numpy boto3 anthropic flask fastapi Pillow 'mcp[cli]'
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --upgrade pip
          .venv-smoke/bin/pip install pytest
          .venv-smoke/bin/pip install -e .

      - name: Generate smoke bundles
        run: .venv-pack/bin/python tests/smoke/pack.py

      - name: Run integration smoke tests
        run: .venv-smoke/bin/pytest tests/smoke/test_smoke.py -v
        env:
          PAKER_SMOKE_DISK_POLICY: disk
