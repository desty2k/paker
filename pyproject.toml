[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paker"
version = "2.0.0"
description = "Encrypted in-memory Python package loader"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Wojciech Wentland", email = "wojciech.wentland@int.pl"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]
keywords = ["python", "package-loader", "in-memory", "encrypted", "native-extensions", "memfd", "code-protection", "bundle", "zero-disk", "importlib"]

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]

[project.scripts]
paker = "paker.__main__:main_entry"

[project.entry-points.pyinstaller40]
hook-dirs = "paker._pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "https://github.com/desty2k/paker"
Repository = "https://github.com/desty2k/paker"

[tool.setuptools.packages.find]
include = ["paker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["paker"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if sys.platform",
]
